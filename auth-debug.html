<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spotify Auth Debug — iPod Widget</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial; margin: 18px; }
    header { margin-bottom: 12px }
    button { margin: 6px 6px 6px 0; padding: 8px 12px; }
    pre { background:#111; color:#0f0; padding:12px; max-height:50vh; overflow:auto }
    .meta { color:#666; font-size:0.9rem }
    .row { margin-bottom:8px }
  </style>
</head>
<body>
  <header>
    <h1>Spotify Auth Debug</h1>
    <div class="meta">This page logs postMessage / BroadcastChannel / storage events so you can test the auth flow inside Notion or other embed environments.</div>
  </header>

  <div class="row">
    <button id="open-auth">Open Spotify Auth (popup)</button>
    <button id="show-tokens">Show Stored Tokens</button>
    <button id="clear-tokens">Clear Stored Tokens</button>
    <button id="open-widget">Open Widget Page</button>
  </div>

  <section>
    <h2>Event Log</h2>
    <pre id="log"></pre>
  </section>

  <script>
    const CLIENT_ID = '6deaf4e348c54584aa56fe560fb2c264';
    const REDIRECT_URI = 'https://mcooper1217-lgtm.github.io/ipod-widget/';

    function log(...args) {
      const el = document.getElementById('log');
      const ts = new Date().toISOString();
      el.textContent = `${ts} - ${args.map(a => {
        try { return typeof a === 'string' ? a : JSON.stringify(a); } catch(e) { return String(a); }
      }).join(' ')}\n` + el.textContent;
      console.log(...args);
    }

    // PKCE helpers (same approach as widget)
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }

    async function openAuthPopup() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);
      localStorage.setItem('code_verifier', codeVerifier);

      const params = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: 'user-read-playback-state user-modify-playback-state streaming',
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      });

      const authUrl = `https://accounts.spotify.com/authorize?${params.toString()}`;
      log('Opening auth popup', authUrl);
      const width = 450; const height = 730;
      const left = (window.screen.width / 2) - (width / 2);
      const top = (window.screen.height / 2) - (height / 2);
      window.open(authUrl, 'SpotifyLogin', `width=${width},height=${height},top=${top},left=${left}`);
    }

    document.getElementById('open-auth').addEventListener('click', openAuthPopup);
    document.getElementById('show-tokens').addEventListener('click', () => {
      const keys = ['access_token','refresh_token','expires_at','code_verifier'];
      const out = {};
      keys.forEach(k => out[k] = localStorage.getItem(k));
      log('Stored tokens', out);
    });
    document.getElementById('clear-tokens').addEventListener('click', () => {
      ['access_token','refresh_token','expires_at','code_verifier'].forEach(k => localStorage.removeItem(k));
      log('Cleared tokens from localStorage');
    });
    document.getElementById('open-widget').addEventListener('click', () => {
      window.open(REDIRECT_URI, '_blank');
    });

    // Listen for postMessage from popup
    window.addEventListener('message', (event) => {
      log('postMessage received', { origin: event.origin, data: event.data });
    });

    // BroadcastChannel listener
    try {
      const bc = new BroadcastChannel('spotify_auth_channel');
      bc.onmessage = (ev) => { log('BroadcastChannel message', ev.data); };
      log('BroadcastChannel listener registered');
    } catch (e) {
      log('BroadcastChannel unavailable', String(e));
    }

    // storage events
    window.addEventListener('storage', (ev) => {
      log('storage event', { key: ev.key, newValue: ev.newValue, oldValue: ev.oldValue });
    });

    // show initial state
    log('Debug page loaded. Current origin: ' + location.origin);
    log('To test: click "Open Spotify Auth" then authenticate in the popup. If the popup posts back, you should see postMessage or BroadcastChannel entries here and localStorage updated.');
  </script>
</body>
</html>
