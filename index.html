<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iPod Spotify Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ipod">
    <!-- Left Screen Display -->
    <div class="screen">
      <div class="header">
        <span>Now Playing</span>
        <span id="battery">🔋</span>
      </div>
      
      <div class="screen-content">
        <div class="album-art-container">
          <img id="album-art" src="https://via.placeholder.com/100" alt="Album Art" />
        </div>
        <div class="song-details">
          <p id="track-name">Not Playing</p>
          <p id="artist-name">Connect Spotify</p>
          <button id="login-btn" class="login-btn" onclick="loginWithSpotify()">Connect</button>
        </div>
      </div>
    </div>

    <!-- Right Click Wheel -->
    <div class="wheel">
      <button class="wheel-btn menu-btn" onclick="syncDeviceAndPlay()">MENU</button>
      <button class="wheel-btn prev-btn" onclick="previousTrack()">⏮</button>
      <button class="wheel-btn next-btn" onclick="nextTrack()">⏭</button>
      <button class="wheel-btn play-btn" onclick="togglePlay()">⏯</button>
      <div class="center-btn" onclick="getCurrentlyPlaying()"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
