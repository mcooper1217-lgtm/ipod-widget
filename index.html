<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iPod Spotify Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ipod">
    <!-- Screen Display -->
    <div class="screen">
      <div class="header">iPod</div>
      <div class="status-container">
        <p id="track-name" style="font-weight: bold;">Not Playing</p>
        <p id="artist-name" style="font-size: 10px; color: #333;"></p>
      </div>
      <button id="login-btn" class="login-btn" onclick="loginWithSpotify()">Connect Spotify</button>
    </div>

    <!-- Click Wheel Controls -->
    <div class="wheel">
      <button class="wheel-btn menu-btn" onclick="getCurrentlyPlaying()">MENU</button>
      <button class="wheel-btn prev-btn" onclick="previousTrack()">⏮</button>
      <button class="wheel-btn next-btn" onclick="nextTrack()">⏭</button>
      <button class="wheel-btn play-btn" onclick="togglePlay()">⏯</button>
      <div class="center-btn" onclick="getCurrentlyPlaying()"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
